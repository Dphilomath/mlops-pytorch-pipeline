apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Resources are applied in the order they appear below
resources:
  - namespace.yaml          # creates the ml-training namespace
  - configmap.yaml          # ConfigMap used by training and serving
  - pvc-data.yaml           # PVC for /app/data
  - pvc-checkpoints.yaml   # PVC for /app/checkpoints
  - training-job.yaml       # Job that trains the model
  - serving-deployment.yaml # Deployment for the FastAPI server
  - serving-service.yaml    # Service (exposes port 80 targeting 8080)
  - web-ui-deployment.yaml  # Deployment for the static Nginx Web UI
  - web-ui-service.yaml     # Service for the Web UI (port 80)
  - web-ui-configmap.yaml   # ConfigMap containing the Web UI index.html
  - ingress.yaml            # Ingress for opssynergy.isroot.in/ml-training/*
  - hpa.yaml                # Optional HorizontalPodAutoscaler

namespace: ml-training

labels:
  - pairs:
      project: mlops-pytorch-pipeline
    includeSelectors: true
    includeTemplates: true
