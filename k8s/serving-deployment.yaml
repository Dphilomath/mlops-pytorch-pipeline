apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
    spec:
      containers:
      - name: serving
        image: ghcr.io/dphilomath/mlops-serve:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: training-config
        env:
        - name: TORCH_HOME
          value: /tmp
        volumeMounts:
        - name: config-volume
          mountPath: /app/configs
        - name: checkpoint-volume
          mountPath: /app/checkpoints
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
          initialDelaySeconds: 15
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      restartPolicy: Always
      volumes:
      - name: config-volume
        configMap:
          name: training-config
          items:
          - key: serving_config.yaml
            path: serving_config.yaml
      - name: checkpoint-volume
        persistentVolumeClaim:
          claimName: checkpoint-pvc
