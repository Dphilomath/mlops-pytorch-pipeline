version: "3.9"
services:
  training:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    container_name: training
    command: python -m src.train
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    environment:
      - CONFIG_PATH=/app/configs/training_config.yaml

  serving:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    container_name: serving
    ports:
      - "9876:9876"
    # command removed – ENTRYPOINT in Dockerfile sets the port

    volumes:
      - ./checkpoints:/app/checkpoints:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    environment:
      - CONFIG_PATH=/app/configs/serving_config.yaml
