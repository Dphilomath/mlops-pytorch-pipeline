services:
  training:
    build:
      context: .
      dockerfile: docker/Dockerfile.train
    container_name: training
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    environment:
      - CONFIG_PATH=/app/configs/training_config.yaml
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow

  serving:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    container_name: serving
    ports:
      - "8080:8080"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
    environment:
      - CONFIG_PATH=/app/configs/serving_config.yaml
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  mlflow:
    image: python:3.11-slim
    container_name: mlflow-server
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install mlflow==2.12.1 && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /app/mlruns --serve-artifacts"
    volumes:
      - ./mlflow-data:/app

