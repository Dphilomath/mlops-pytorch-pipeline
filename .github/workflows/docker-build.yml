name: Build & Push Docker Images
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push training image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/mlops-train:latest -f docker/Dockerfile.train .
          docker push ghcr.io/${{ github.repository_owner }}/mlops-train:latest

      - name: Build and push serving image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/mlops-serve:latest -f docker/Dockerfile.serve .
          docker push ghcr.io/${{ github.repository_owner }}/mlops-serve:latest
