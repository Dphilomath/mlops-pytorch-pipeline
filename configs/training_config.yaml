model:
  architecture: resnet18
  num_classes: 10

data:
  data_dir: /app/data
  dataset: cifar10

training:
  strategy: "strategy_3"  # Options: strategy_2, strategy_3
  optimizer: "sgd"        # Options: adam, sgd
  scheduler: "cosine"     # Options: none, cosine
  epochs: 10
  batch_size: 64
  learning_rate: 0.1
  early_stopping_patience: 3

output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier_v1.pt
