model:
  architecture: resnet18
  num_classes: 10

data:
  data_dir: /app/data
  dataset: cifar10

training:
  strategy: "baseline"  # Options: baseline, transfer_learning, custom_resnet, augmented_sgd
  optimizer: "adam"     # Options: adam, sgd
  scheduler: "none"     # Options: none, cosine
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  early_stopping_patience: 3

output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier_v1.pt
